<!doctype html><html lang="en" data-bs-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PulseWatch</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/app.css" rel="stylesheet"></head><body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/js/app.js"></script>
<script>
(async () => {
  const m = shell('home'); if (!m) return
  try {
    const d = await api('/api/dashboard/'), mx = Math.max(1, ...d.chart.map(c => c.total)), c = d.checks
    m.innerHTML = `<h1 class="title">Dashboard</h1><div class="stats">
      ${stat('MONITORS', d.monitors.active + '/' + d.monitors.total, 'list', 'blue', d.monitors.total ? d.monitors.active / d.monitors.total * 100 : 0)}
      ${stat('UPTIME %', c.uptime_percentage == null ? '—' : c.uptime_percentage + '%', 'ok', 'green', c.uptime_percentage ?? 0)}
      ${stat('OPEN INCIDENTS', d.incidents.open, 'alert', 'red', d.incidents.total ? d.incidents.open / d.incidents.total * 100 : 0)}
      ${stat('AVG TIME', c.average_response_time == null ? '—' : Math.round(c.average_response_time) + ' ms', 'clock', 'violet')}</div>
    <section class="card"><h2>Checks, last 7 days</h2><div class="bars">${d.chart.map(x => `<div class="bcol" title="${x.successful} ok / ${x.failed} failed"><div class="stack" style="height:${x.total / mx * 100}%"><i class="f" style="flex:${x.failed}"></i><i class="s" style="flex:${x.successful}"></i></div><span>${new Date(x.date).toLocaleDateString([], { weekday: 'short' })}</span></div>`).join('')}</div></section>
    <section class="card"><h2>Recent incidents</h2>${d.recent_incidents.length ? `<div class="table-responsive"><table class="table"><thead><tr><th>Monitor</th><th>Reason</th><th>Started</th><th>Status</th></tr></thead><tbody>${d.recent_incidents.map(i => `<tr><td><a href="/monitor.html?id=${i.monitor_id}">${esc(i.monitor_name)}</a></td><td>${esc(i.reason)}</td><td>${fmtDate(i.started_at)}</td><td>${badge(i.is_resolved, i.is_resolved ? 'Resolved' : 'Open')}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">No incidents. Everything is up.</div>'}</section>`
  } catch (e) { m.innerHTML = errBox(e.message) }
})()
</script></body></html>
