<!doctype html><html lang="en" data-bs-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PulseWatch</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/app.css" rel="stylesheet"></head><body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/js/app.js"></script>
<script>
const m = shell('profile')
m.innerHTML = `<h1 class="title">Profile</h1>
<form id="pf" class="card"><h2>Account</h2><div class="row g-3"><div class="col-md-6"><label class="form-label">Username</label><input id="u" class="form-control" disabled></div><div class="col-md-6"><label class="form-label">Email</label><input id="e" class="form-control" disabled></div>
<div class="col-md-6"><label class="form-label">First name</label><input name="first_name" class="form-control"></div><div class="col-md-6"><label class="form-label">Last name</label><input name="last_name" class="form-control"></div>
<div class="col-12" id="pf-msg"></div><div class="col-12 text-end"><button class="btn btn-success">Save changes</button></div></div></form>
<form id="pw" class="card"><h2>Change password</h2><div class="row g-3"><div class="col-md-6"><label class="form-label">Current password</label><input name="old_password" type="password" class="form-control" required autocomplete="current-password"></div>
<div class="col-md-6"><label class="form-label">New password</label><input name="new_password" type="password" class="form-control" required autocomplete="new-password"></div>
<div class="col-12" id="pw-msg"></div><div class="col-12 text-end"><button class="btn btn-success">Change password</button></div></div><p class="text-secondary small mt-3 mb-0">After changing the password you will be signed out on all devices.</p></form>
<div><button class="btn btn-outline-secondary" onclick="logout()">Sign out</button></div>`
api('/api/accounts/profile/').then(u => { document.getElementById('u').value = u.username; document.getElementById('e').value = u.email; pf.elements.first_name.value = u.first_name; pf.elements.last_name.value = u.last_name }).catch(x => pf_msg(x.message))
const pf_msg = (t, ok) => document.getElementById('pf-msg').innerHTML = ok ? `<div class="alert-box ok">${esc(t)}</div>` : errBox(t)
pf.onsubmit = async e => { e.preventDefault(); try { await api('/api/accounts/profile/', { method: 'PATCH', body: Object.fromEntries(new FormData(pf)) }); pf_msg('Saved.', true) } catch (x) { pf_msg(x.message) } }
pw.onsubmit = async e => { e.preventDefault(); try { await api('/api/accounts/change-password/', { method: 'POST', body: Object.fromEntries(new FormData(pw)) }); logout() } catch (x) { document.getElementById('pw-msg').innerHTML = errBox(x.message) } }
</script></body></html>
