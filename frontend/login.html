<!doctype html><html lang="en" data-bs-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PulseWatch</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/app.css" rel="stylesheet"></head><body>
<div class="auth"><form id="f" class="card auth-card"><div class="brand"><span class="logo" id="lg"></span><div><b>PULSEWATCH</b><small>monitor everything</small></div></div><h1 class="h3">Sign in</h1>
<div><label class="form-label">Username or email</label><input name="username" class="form-control" required autofocus></div>
<div><label class="form-label">Password</label><input name="password" type="password" class="form-control" required></div><div id="msg"></div><div class="text-end"><a href="/forgot-password.html" class="small">Forgot password?</a></div>
<button class="btn btn-success">Sign in</button><p class="text-secondary mb-0">New here? <a href="/register.html">Create account</a></p></form></div><script src="/js/app.js"></script>
<script>lg.innerHTML = ic('pulse')
f.onsubmit = async e => { e.preventDefault(); const b = Object.fromEntries(new FormData(f))
  try { saveTokens(await api('/api/accounts/login/', { method: 'POST', body: b }, false)); location.href = '/index.html' } catch (x) { msg.innerHTML = errBox(x.message.includes('No active account') ? 'Wrong credentials, or the email is not verified yet.' : x.message) } }</script></body></html>
