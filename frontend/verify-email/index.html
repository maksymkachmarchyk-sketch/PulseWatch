<!doctype html><html lang="en" data-bs-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PulseWatch</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/app.css" rel="stylesheet"></head><body>
<div class="auth"><div class="card auth-card"><h1 class="h3">Email verification</h1><div id="msg" class="alert-box ok">Verifying your email…</div><a class="btn btn-success" href="/login.html">Go to sign in</a></div></div>
<script src="/js/app.js"></script><script>
const q = new URLSearchParams(location.search)
api('/api/accounts/verify/' + q.get('uid') + '/' + q.get('token') + '/', {}, false).then(r => msg.textContent = r.message, e => { msg.className = 'alert-box'; msg.textContent = e.message })
</script></body></html>
