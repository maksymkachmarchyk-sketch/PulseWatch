<!doctype html><html lang="en" data-bs-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PulseWatch</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/app.css" rel="stylesheet"></head><body>
<div class="auth"><form id="f" class="card auth-card"><div class="brand"><span class="logo" id="lg"></span><div><b>PULSEWATCH</b><small>monitor everything</small></div></div><h1 class="h3">Reset password</h1>
<p class="text-secondary mb-0">Enter your email and we will send you a reset link.</p><div><label class="form-label">Email</label><input name="email" type="email" class="form-control" required autofocus></div><div id="msg"></div>
<button class="btn btn-success">Send reset link</button><p class="text-secondary mb-0"><a href="/login.html">Back to sign in</a></p></form></div><script src="/js/app.js"></script>
<script>lg.innerHTML = ic('pulse')
f.onsubmit = async e => { e.preventDefault()
  try { const r = await api('/api/accounts/password-reset/', { method: 'POST', body: Object.fromEntries(new FormData(f)) }, false); msg.innerHTML = '<div class="alert-box ok">' + esc(r.message) + '</div>' } catch (x) { msg.innerHTML = errBox(x.message) } }</script></body></html>
