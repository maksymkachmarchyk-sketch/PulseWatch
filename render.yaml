databases:
  - name: pulsewatch-db
    plan: free

services:
  - type: web
    name: pulsewatch
    runtime: docker
    plan: free
    healthCheckPath: /login.html
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pulsewatch-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: AUTO_VERIFY_USERS
        value: "False"
      - key: EMAIL_BACKEND
        value: accounts.email_backend.BrevoEmailBackend
      - key: DEFAULT_FROM_EMAIL
        value: pulsewatch81@gmail.com
      - key: BREVO_API_KEY
        sync: false